[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "h200-ironwood-teacher-forcing"
version = "0.1.0"
description = "Teacher-forced logit and hidden-state comparison on H200 and Ironwood"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
capture = ["transformers>=4.51,<6", "safetensors>=0.5"]
notebook = ["ipykernel>=6"]
dev = ["pytest>=8"]

[project.scripts]
teacher-parity = "teacher_forcing.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
